name: Windows Build

on:
  push:
    branches: [main, release-v0.5.0-updater]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Show tool versions
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          rustup show active-toolchain

      - name: Build Rust single-file Windows app
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Verify single-file output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'dist/windows-3d-viewer.exe'
          $files = @(Get-ChildItem -LiteralPath 'dist' -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'windows-3d-viewer.exe') {
            throw 'dist must contain exactly one distributable file: windows-3d-viewer.exe'
          }
          if (Test-Path 'dist/WebView2Loader.dll') {
            throw 'WebView2Loader.dll must not be distributed separately.'
          }
          Write-Host "Single Rust EXE verified: $($exe.Path)"
          Write-Host "Size: $((Get-Item $exe).Length) bytes"

      - name: Smoke test standalone EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process -Name 'windows-3d-viewer' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $errorLog = Join-Path $env:LOCALAPPDATA 'Windows3DViewer/startup-error.log'
          if (Test-Path $errorLog) { Remove-Item $errorLog -Force }

          $exe = Resolve-Path 'dist/windows-3d-viewer.exe'
          $process = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()

          if ($process.HasExited) {
            if (Test-Path $errorLog) {
              Write-Host '--- Rust startup error log ---'
              Get-Content $errorLog -Raw
            }
            throw "Standalone Rust app exited during startup smoke test with exit code $($process.ExitCode)."
          }
          if (Test-Path $errorLog) {
            Get-Content $errorLog -Raw
            throw 'Rust runtime wrote a startup error log.'
          }

          Stop-Process -Id $process.Id -Force
          Write-Host 'Standalone Rust EXE stayed running from an unrelated working directory.'

      - name: Smoke test model argument
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process -Name 'windows-3d-viewer' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $sampleDir = Join-Path $env:RUNNER_TEMP 'windows-3d-viewer-rust-sample'
          if (Test-Path $sampleDir) { Remove-Item $sampleDir -Recurse -Force }
          New-Item -ItemType Directory -Path $sampleDir -Force | Out-Null
          $sample = Join-Path $sampleDir 'association-smoke.stl'
          @'
          solid association_smoke
            facet normal 0 0 1
              outer loop
                vertex 0 0 0
                vertex 1 0 0
                vertex 0 1 0
              endloop
            endfacet
          endsolid association_smoke
          '@ | Set-Content -LiteralPath $sample -Encoding ascii

          $errorLog = Join-Path $env:LOCALAPPDATA 'Windows3DViewer/startup-error.log'
          if (Test-Path $errorLog) { Remove-Item $errorLog -Force }

          $exe = Resolve-Path 'dist/windows-3d-viewer.exe'
          $process = Start-Process -FilePath $exe -ArgumentList ('"' + $sample + '"') -WorkingDirectory $env:RUNNER_TEMP -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()

          if ($process.HasExited) {
            if (Test-Path $errorLog) {
              Write-Host '--- Rust startup error log ---'
              Get-Content $errorLog -Raw
            }
            throw "Rust app exited while opening an STL argument with exit code $($process.ExitCode)."
          }
          if (Test-Path $errorLog) {
            Get-Content $errorLog -Raw
            throw 'Rust runtime wrote a startup error while opening an STL argument.'
          }

          Stop-Process -Id $process.Id -Force
          Write-Host 'Model-argument smoke test passed.'

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash -Algorithm SHA256 'dist/windows-3d-viewer.exe').Hash.ToLowerInvariant()
          "$hash  windows-3d-viewer.exe" | Set-Content -LiteralPath 'dist/windows-3d-viewer.exe.sha256' -Encoding ascii -NoNewline
          Write-Host "SHA-256: $hash"

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem 'dist/windows-3d-viewer.exe*' | Format-Table FullName, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-3d-viewer-windows-x64-rust-single-exe
          path: |
            dist/windows-3d-viewer.exe
            dist/windows-3d-viewer.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path 'Cargo.toml' -Pattern '^version = "([^"]+)"$'
          if (-not $match) { throw 'Could not read package version from Cargo.toml.' }
          $version = $match.Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release create $tag `
            'dist/windows-3d-viewer.exe' `
            'dist/windows-3d-viewer.exe.sha256' `
            --target $env:GITHUB_SHA `
            --title "Windows 3D Viewer $tag" `
            --generate-notes
