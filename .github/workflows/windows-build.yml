name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Install Native SDK CLI
        shell: pwsh
        run: npm install -g @native-sdk/cli@0.9.4

      - name: Show tool versions
        shell: pwsh
        run: |
          node --version
          npm --version
          zig version
          native version

      - name: Build and package Windows app
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Resolve-Path 'dist/windows-3d-viewer-windows-x64.zip'
          $smoke = Join-Path $env:RUNNER_TEMP 'windows-3d-viewer-smoke'
          if (Test-Path $smoke) { Remove-Item $smoke -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $smoke -Force
          $exe = Get-ChildItem $smoke -Recurse -Filter 'windows-3d-viewer.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Packaged EXE not found after extraction.' }
          $process = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA 'com.emadgh.windows3dviewer/Logs/native-sdk.jsonl'
            if (Test-Path $log) {
              Write-Host '--- Native SDK runtime log ---'
              Get-Content $log -Tail 200
            }
            throw "Packaged app exited during startup smoke test with exit code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host 'Startup smoke test passed: production package stayed running.'

      - name: Verify Explorer launcher and native bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process -Name 'windows-3d-viewer' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $zip = Resolve-Path 'dist/windows-3d-viewer-windows-x64.zip'
          $smoke = Join-Path $env:RUNNER_TEMP 'windows-3d-viewer-association-smoke'
          if (Test-Path $smoke) { Remove-Item $smoke -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $smoke -Force
          $packageRoot = Get-ChildItem $smoke -Directory | Where-Object { $_.Name -eq 'windows-3d-viewer-windows' } | Select-Object -First 1
          if (-not $packageRoot) { throw 'Packaged application root not found.' }

          $stageRoot = Join-Path $env:LOCALAPPDATA 'Windows3DViewer/launch-cache'
          if (Test-Path $stageRoot) { Remove-Item $stageRoot -Recurse -Force }

          $sampleDir = Join-Path $env:RUNNER_TEMP 'windows-3d-viewer-sample'
          if (Test-Path $sampleDir) { Remove-Item $sampleDir -Recurse -Force }
          New-Item -ItemType Directory -Path $sampleDir -Force | Out-Null
          $sample = Join-Path $sampleDir 'association-smoke.stl'
          @'
          solid association_smoke
            facet normal 0 0 1
              outer loop
                vertex 0 0 0
                vertex 1 0 0
                vertex 0 1 0
              endloop
            endfacet
          endsolid association_smoke
          '@ | Set-Content -LiteralPath $sample -Encoding ascii

          # Exercise the exact launcher shipped in the production ZIP. It
          # stages the requested model and starts the production executable.
          $launcher = Join-Path $packageRoot.FullName 'open-model.ps1'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $launcher $sample
          Start-Sleep -Seconds 3

          $productionProcess = Get-Process -Name 'windows-3d-viewer' -ErrorAction SilentlyContinue | Sort-Object StartTime -Descending | Select-Object -First 1
          if (-not $productionProcess) { throw 'Explorer launcher did not start the production viewer.' }

          $manifest = Join-Path $stageRoot 'launch.json'
          $stagedModel = Join-Path $stageRoot 'association-smoke.stl'
          if (-not (Test-Path $manifest)) { throw 'Explorer launcher did not write launch.json.' }
          if (-not (Test-Path $stagedModel)) { throw 'Explorer launcher did not stage the model in LocalAppData.' }
          Stop-Process -Id $productionProcess.Id -Force -ErrorAction SilentlyContinue

          # GitHub hosted Windows runners do not reliably execute arbitrary
          # WebView DOM JavaScript. Verify the native half deterministically
          # through Native SDK's own automation bridge instead. The final ZIP
          # above remains the normal production build without automation.
          $workspace = Resolve-Path '.native-workspace/windows-3d-viewer'
          Push-Location $workspace
          try {
            if (Test-Path '.zig-cache/native-sdk-automation') {
              Remove-Item '.zig-cache/native-sdk-automation' -Recurse -Force
            }

            native build -Dautomation=true
            if ($LASTEXITCODE -ne 0) { throw 'Automation-enabled verification build failed.' }

            $automationExe = Resolve-Path 'zig-out/bin/windows-3d-viewer.exe'
            $automationProcess = Start-Process -FilePath $automationExe -WorkingDirectory $workspace -PassThru
            try {
              native automate wait
              if ($LASTEXITCODE -ne 0) { throw 'Native SDK automation did not become ready.' }

              $manifestRequest = '{"id":"manifest","command":"app.getLaunchManifest","payload":{}}'
              $manifestResponse = (& native automate bridge $manifestRequest 2>&1 | Out-String)
              Write-Host $manifestResponse
              if ($LASTEXITCODE -ne 0 -or $manifestResponse -notmatch '"ok":true' -or $manifestResponse -notmatch 'association-smoke\.stl') {
                throw 'app.getLaunchManifest did not return the staged STL.'
              }

              $chunkRequest = '{"id":"chunk","command":"app.readLaunchFileChunk","payload":{"path":"association-smoke.stl","offset":0}}'
              $chunkResponse = (& native automate bridge $chunkRequest 2>&1 | Out-String)
              Write-Host $chunkResponse
              if ($LASTEXITCODE -ne 0 -or $chunkResponse -notmatch '"ok":true' -or $chunkResponse -notmatch '"data":"[A-Za-z0-9+/=]+"') {
                throw 'app.readLaunchFileChunk did not return model bytes.'
              }

              $consumeRequest = '{"id":"consume","command":"app.consumeLaunchRequest","payload":{}}'
              $consumeResponse = (& native automate bridge $consumeRequest 2>&1 | Out-String)
              Write-Host $consumeResponse
              if ($LASTEXITCODE -ne 0 -or $consumeResponse -notmatch '"ok":true') {
                throw 'app.consumeLaunchRequest failed.'
              }
            }
            finally {
              if ($automationProcess -and -not $automationProcess.HasExited) {
                Stop-Process -Id $automationProcess.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }
          finally {
            Pop-Location
          }

          if (Test-Path $manifest) { throw 'Launch manifest still exists after native bridge consume.' }
          Write-Host 'Association verification passed: launcher staged the STL and the native bridge read/consumed it.'

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Format-Table FullName, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-3d-viewer-windows-x64
          path: dist/windows-3d-viewer-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
