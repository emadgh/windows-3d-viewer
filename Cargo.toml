[package]
name = "windows-3d-viewer"
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
description = "Single-file Windows 3D model viewer with an embedded Vite frontend"
license = "MIT"

[dependencies]
base64 = "0.22"
mime_guess = "2.0.5"
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.37.0"
walkdir = "2.5"
wry = "0.57.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = "symbols"
